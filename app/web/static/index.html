<!doctype html>
<html lang="fr">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#25d366" />
    <link rel="manifest" href="/manifest.json" />
    <title>WhatsApp Transcription</title>
    <style>
      body {
        font-family: system-ui, sans-serif;
        max-width: 32rem;
        margin: 3rem auto;
        padding: 0 1rem;
      }
      form {
        display: flex;
        flex-direction: column;
        gap: 0.75rem;
      }
      button {
        padding: 0.5rem;
        cursor: pointer;
      }
      pre {
        white-space: pre-wrap;
        word-break: break-word;
        background: #f2f2f2;
        padding: 1rem;
        border-radius: 0.25rem;
      }
    </style>
  </head>
  <body>
    <h1>Transcription de note vocale</h1>
    <form id="upload-form">
      <input type="file" id="audio" accept=".opus,.ogg" required />
      <select id="language" required>
        <option value="fr" selected>Français</option>
        <option value="en">English</option>
      </select>
      <button type="submit">Transcrire</button>
    </form>
    <pre id="result"></pre>
    <script>
      const form = document.getElementById("upload-form");
      const result = document.getElementById("result");

      form.addEventListener("submit", async (event) => {
        event.preventDefault();
        const formData = new FormData();
        formData.append("audio", document.getElementById("audio").files[0]);
        formData.append("language", document.getElementById("language").value);

        result.textContent = "Transcription en cours...";
        const response = await fetch("/transcript", { method: "POST", body: formData });
        const data = await response.json();
        result.textContent = response.ok ? data.text : `Erreur : ${data.message}`;
      });

      if ("serviceWorker" in navigator) {
        navigator.serviceWorker.register("/sw.js");
      }

      const SHARE_TARGET_CACHE = "share-target-cache";
      const SHARED_AUDIO_KEY = "/shared-audio";

      async function prefillSharedAudio() {
        if (new URLSearchParams(location.search).get("shared") !== "1") {
          return;
        }
        history.replaceState(null, "", location.pathname);

        if (!("caches" in window)) {
          return;
        }
        const cache = await caches.open(SHARE_TARGET_CACHE);
        const response = await cache.match(SHARED_AUDIO_KEY);
        if (!response) {
          return;
        }
        await cache.delete(SHARED_AUDIO_KEY);

        const blob = await response.blob();
        const filename = response.headers.get("X-Shared-Filename") || "shared-audio.ogg";
        const file = new File([blob], filename, { type: blob.type });

        const dataTransfer = new DataTransfer();
        dataTransfer.items.add(file);
        document.getElementById("audio").files = dataTransfer.files;
        document.getElementById("language").focus();
      }

      prefillSharedAudio();
    </script>
  </body>
</html>
